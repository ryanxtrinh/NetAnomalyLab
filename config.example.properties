# Copy to my.properties, edit, and run with:  --config my.properties
# Any key you leave out keeps its default.

# Port scans
scanWindowSec=60
scanPortThreshold=25
scanHostThreshold=20

# Beaconing
beaconMinConns=10
beaconMaxCv=0.15
beaconMinIntervalSec=5
beaconExternalOnly=true

# DNS tunneling
dnsMinSubdomainLen=30
dnsMinEntropy=3.5
dnsMinSuspiciousQueries=10

# Exfiltration (bytes)
exfilMinBytes=104857600
exfilUploadRatio=5.0

# Isolation Forest
mlTrees=100
mlSampleSize=256
mlScoreThreshold=0.62
mlMaxAlerts=15
mlSeed=42
